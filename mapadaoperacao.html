<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CTRL S Norte | Mapa da Operação</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root{--bg:#031322;--panel:#071d31;--panel2:#0a2740;--line:#17415f;--green:#73dc43;--green2:#35a72d;--text:#f6fbff;--muted:#93a8b9;--blue:#0d3151}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 55% 10%,#0c2c3d 0,#041827 34%,#020d18 75%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.app{max-width:1600px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:24px;border-bottom:1px solid #173249;padding-bottom:18px}.brand{font-size:30px;font-weight:900;font-style:italic;line-height:.85}.brand b{color:var(--green)}.brand small{font-size:11px;letter-spacing:4px;color:var(--green);font-style:normal}.tabs{margin-left:auto;display:flex;gap:8px}.tab{border:1px solid #20445f;color:#b9c8d4;background:#071727;padding:10px 18px;border-radius:9px}.tab.active{background:linear-gradient(135deg,#285c1f,#153e24);border-color:#4cbf35;color:#fff}.event{border:1px solid #58d63e;border-radius:10px;padding:9px 18px;color:var(--green);font-weight:800}.hero{display:grid;grid-template-columns:230px 1fr;gap:25px;padding:34px 0 20px}.hero h1{font-size:42px;font-weight:900}.hero h1 span{color:var(--green)}.hero p{color:var(--muted);letter-spacing:2px}.map{position:relative;height:300px}.road{position:absolute;left:3%;right:3%;top:140px;height:22px;border-radius:50%;border-top:6px solid #d8e2e7;transform:rotate(-1deg);opacity:.55}.nodes{position:absolute;inset:30px 0 0;display:flex;justify-content:space-around;align-items:center}.node{text-align:center;width:150px;cursor:pointer;transition:.25s}.node:hover{transform:translateY(-7px)}.orb{width:82px;height:82px;margin:auto;border-radius:20px;display:grid;place-items:center;font-size:31px;background:linear-gradient(145deg,#122d43,#06111d);border:1px solid #36506a;box-shadow:0 12px 25px #0008}.node.done .orb,.node.active .orb{background:linear-gradient(145deg,#65d43e,#185c2a);border-color:#82ef58;box-shadow:0 0 30px #5fe43c55}.node.active .orb{animation:pulse 1.8s infinite}@keyframes pulse{50%{box-shadow:0 0 45px #68f242aa}}.node h6{font-weight:850;margin-top:14px}.badge-state{font-size:11px;padding:5px 12px;border-radius:12px;border:1px solid #49627a;color:#9eb2c1}.done .badge-state,.active .badge-state{color:#7bed51;border-color:#49a93b;background:#10361e}.status-card,.task-card{background:linear-gradient(145deg,#081d30dd,#041523ee);border:1px solid #193c55;border-radius:15px}.status-card{padding:22px 26px;display:grid;grid-template-columns:1.1fr 1.4fr auto;gap:28px;align-items:center}.progress{height:10px;background:#132d43}.progress-bar{background:linear-gradient(90deg,#77e947,#38a934)}.task-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:18px}.task-card{padding:18px;min-height:260px}.task-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #234159;padding-bottom:11px;margin-bottom:10px}.task-head h5{margin:0;font-weight:850}.task{display:flex;gap:10px;padding:8px 0;color:#dce6ed;cursor:pointer}.task input{accent-color:#65d23f;width:18px;height:18px}.task.done span{text-decoration:line-through;color:#688091}.admin{position:fixed;right:22px;bottom:22px}.btn-green{background:var(--green);color:#071522;font-weight:850;border:0}.modal-content{background:#071b2d;color:white;border:1px solid #29506a}.form-control,.form-select{background:#0b2940;border-color:#31546d;color:white}.form-control:focus,.form-select:focus{background:#0b2940;color:white}.toast-container{z-index:2000}.achievement{font-size:54px}.footer{display:flex;justify-content:space-between;color:#6e8798;font-size:11px;letter-spacing:3px;padding:25px 5px}@media(max-width:1000px){.hero{grid-template-columns:1fr}.task-grid{grid-template-columns:1fr 1fr}.nodes{overflow-x:auto;justify-content:flex-start;gap:30px}.map{overflow:hidden}.status-card{grid-template-columns:1fr}.tabs{display:none}}@media(max-width:650px){.task-grid{grid-template-columns:1fr}.event{display:none}.app{padding:14px}.hero h1{font-size:34px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Ctrl<b>S</b> Soft.<br><small>NORTE</small></div><div class="text-secondary small">TECNOLOGIA QUE CONECTA<br>O MERCADO AUTOMOTIVO.</div><div class="tabs"><button class="tab active">⌂ MAPA DA OPERAÇÃO</button><button class="tab">☑ ENTREGAS</button><button class="tab">♟ TIME</button></div><div class="event">🏆 PRÓXIMA ETAPA<br><span class="text-white">EVENTO • 24/10</span></div></header>
<section class="hero"><div><h1>NOSSA <span>JORNADA</span></h1><p>DA ESTRUTURAÇÃO<br>AO RESULTADO.</p></div><div class="map"><div class="road"></div><div class="nodes" id="nodes"></div></div></section>
<section class="status-card"><div><div class="small text-secondary">FASE ATUAL</div><h3 id="phaseTitle" class="fw-bold mb-2"></h3><div class="progress"><div id="phaseProgress" class="progress-bar"></div></div></div><div><p id="phaseDescription" class="mb-0 text-light"></p></div><button class="btn btn-outline-success" onclick="openAdmin()">GERENCIAR ENTREGAS →</button></section>
<div class="task-grid" id="taskGrid"></div>
<div class="footer"><span>CTRL S NORTE • MAPA DA OPERAÇÃO</span><span>MAIS PARCERIAS • MAIS RESULTADOS</span></div>
</div>
<button class="btn btn-green admin shadow" onclick="openAdmin()">⚙ MODO ADMIN</button>
<div class="modal fade" id="adminModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content"><div class="modal-header border-secondary"><h5 class="modal-title">Gerenciar entregáveis</h5><button class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-2"><div class="col-md-4"><select id="newArea" class="form-select"><option>Comercial</option><option>Operação</option><option>Controle</option><option>Evento</option></select></div><div class="col-md-6"><input id="newTask" class="form-control" placeholder="Novo entregável"></div><div class="col-md-2 d-grid"><button class="btn btn-green" onclick="addTask()">Adicionar</button></div></div><hr class="border-secondary"><div id="adminList"></div><div class="mt-3 d-flex gap-2"><button class="btn btn-outline-light btn-sm" onclick="resetData()">Restaurar padrão</button><button class="btn btn-outline-success btn-sm" onclick="exportData()">Exportar JSON</button></div></div></div></div></div>
<div class="toast-container position-fixed top-0 end-0 p-3"><div id="toast" class="toast text-bg-success"><div class="toast-body">🏆 Fase concluída! Próxima etapa desbloqueada.</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const phases=[
 {name:'Planejamento',icon:'✓',desc:'Objetivos, estrutura e direção inicial definidas.',locked:false},
 {name:'Estruturação',icon:'▣',desc:'Materiais e bases iniciais da operação construídos.',locked:false},
 {name:'Validação da Operação',icon:'⚙',desc:'Confirmar processos com a Matriz e deixar a CTRL S Norte pronta para comercializar, implantar e atender.',locked:false},
 {name:'Pré-Evento',icon:'★',desc:'Captação, convites, divulgação, roteiro e preparação da demonstração.',locked:true},
 {name:'Evento',icon:'🏆',desc:'Demonstração Vistoria GO em Belém e geração de oportunidades.',locked:true},
 {name:'Expansão',icon:'↗',desc:'Converter oportunidades, ativar clientes e expandir a operação Norte.',locked:true}
];
const defaults={
 Comercial:[['Validar tabela comercial e comissões',false],['Finalizar proposta comercial',false],['Definir estratégia de captação',false],['Alinhar lista de convidados',false],['Preparar roteiro da demonstração',false],['Resolver pendências com a Matriz',false]],
 'Operação':[['Validar fluxo comercial',false],['Validar implantação e suporte',false],['Validar processo de treinamento',false],['Validar cadastro e ativação de clientes',false],['Definir argumentário de venda',false]],
 Controle:[['Atualizar planilha de custos',true],['Finalizar planilha de produtos e valores',false],['Organizar base de leads',false],['Estruturar CRM / acompanhamento',false],['Preparar lista de convidados e envios',false]],
 Evento:[['Definir estratégia de divulgação',false],['Criar materiais de convite',false],['Confirmar local, estrutura e roteiro',false]]
};
let data=JSON.parse(localStorage.getItem('ctrlsNorteGame')||'null')||structuredClone(defaults); let currentPhase=2;
function save(){localStorage.setItem('ctrlsNorteGame',JSON.stringify(data));render()}
function stats(){let all=Object.values(data).flat();let done=all.filter(x=>x[1]).length;return {done,total:all.length,pct:Math.round(done/all.length*100)}}
function renderNodes(){let s=stats();document.getElementById('nodes').innerHTML=phases.map((p,i)=>{let cls=i<2?'done':i===2?'active':'';let state=i<2?'CONCLUÍDO':i===2?`${s.pct}% • EM ANDAMENTO`:'BLOQUEADO';return `<div class="node ${cls}" onclick="selectPhase(${i})"><div class="orb">${i>2?'🔒':p.icon}</div><h6>${i+1}. ${p.name.toUpperCase()}</h6><span class="badge-state">${state}</span></div>`}).join('')}
function render(){let s=stats();renderNodes();document.getElementById('phaseTitle').textContent='3. VALIDAÇÃO DA OPERAÇÃO';document.getElementById('phaseDescription').textContent=phases[2].desc;document.getElementById('phaseProgress').style.width=s.pct+'%';document.getElementById('taskGrid').innerHTML=Object.entries(data).map(([area,tasks])=>{let d=tasks.filter(x=>x[1]).length;return `<div class="task-card"><div class="task-head"><h5>${area==='Comercial'?'🤝':area==='Operação'?'⚙️':area==='Controle'?'📋':'📣'} ${area.toUpperCase()}</h5><b>${d}/${tasks.length}</b></div>${tasks.map((t,i)=>`<label class="task ${t[1]?'done':''}"><input type="checkbox" ${t[1]?'checked':''} onchange="toggle('${area}',${i})"><span>${t[0]}</span></label>`).join('')}</div>`}).join('');if(s.pct===100&&!sessionStorage.getItem('won')){sessionStorage.setItem('won','1');new bootstrap.Toast(document.getElementById('toast')).show()}}
function toggle(a,i){data[a][i][1]=!data[a][i][1];save()}
function selectPhase(i){if(i<2)alert('Fase concluída ✓');else if(i===2)document.querySelector('.status-card').scrollIntoView({behavior:'smooth'});else alert('🔒 Esta fase será liberada após a validação da operação.')}
function openAdmin(){renderAdmin();bootstrap.Modal.getOrCreateInstance(document.getElementById('adminModal')).show()}
function renderAdmin(){document.getElementById('adminList').innerHTML=Object.entries(data).map(([a,ts])=>`<h6 class="mt-3 text-success">${a}</h6>${ts.map((t,i)=>`<div class="d-flex gap-2 mb-2"><input class="form-control" value="${t[0].replaceAll('"','&quot;')}" onchange="renameTask('${a}',${i},this.value)"><button class="btn btn-outline-danger" onclick="removeTask('${a}',${i})">×</button></div>`).join('')}`).join('')}
function renameTask(a,i,v){data[a][i][0]=v;save()}
function removeTask(a,i){data[a].splice(i,1);save();renderAdmin()}
function addTask(){let a=document.getElementById('newArea').value,v=document.getElementById('newTask').value.trim();if(!v)return;data[a].push([v,false]);document.getElementById('newTask').value='';save();renderAdmin()}
function resetData(){if(confirm('Restaurar todos os entregáveis para o padrão?')){data=structuredClone(defaults);localStorage.removeItem('ctrlsNorteGame');sessionStorage.removeItem('won');save();renderAdmin()}}
function exportData(){let b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='ctrls-norte-entregaveis.json';a.click();URL.revokeObjectURL(u)}
render();
</script>
</body></html>
